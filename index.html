<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>Tower Defense</h1>
<div class="bar">
  <span class="chip" title="Oro">Oro <b id="gold"></b></span>
  <span class="chip" title="Vidas">Vidas <b id="lives"></b></span>
  <span class="chip" title="Oleada">Oleada <b id="wave"></b>/20</span>
</div>
<div class="game">
  <aside class="side left">
    <div class="row" id="shop"></div>
    <div class="row" id="sel" hidden>
      <button id="up"></button><button id="sell"></button>
      <button id="pri"></button>
    </div>
  </aside>
  <canvas id="c" width="1280" height="960"></canvas>
  <aside class="side">
    <div class="row">
      <button class="go" id="start">Iniciar oleada</button>
      <button id="speed">Velocidad x1</button>
      <button id="pause">Pausa</button>
      <button id="restart">Reiniciar</button>
      <button id="mapbtn"></button>
      <button id="mute">Sonido: sí</button>
      <button id="diff">Dificultad: Normal</button>
    </div>
    <div id="next"></div>
    <div id="info">Elige una torre y haz clic en un casillero libre para colocarla.</div>
    <div class="hint">Espacio: iniciar oleada · números: elegir torre · P: pausa · M: sonido</div>
  </aside>
</div>
</main>
<div id="title" role="dialog" aria-label="Pantalla de inicio" tabindex="0">
  <canvas id="tcv" width="640" height="480"></canvas>
  <div class="tbox">
    <div class="tsub">Defiende el camino</div>
    <div class="tlogo"><span>TOWER</span><span>DEFENSE</span></div>
    <button id="play" class="tplay">&#9654; Jugar</button>
    <div class="tblink" id="tblink">Presiona para empezar</div>
    <div class="tmeta" id="tmeta"></div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/maps.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/title.js"></script>
</body>
</html>
