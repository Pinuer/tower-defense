<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>Tower Defense</h1>
<div class="bar">
  <span class="chip" title="Oro">Oro <b id="gold"></b></span>
  <span class="chip" title="Vidas">Vidas <b id="lives"></b></span>
  <span class="chip" title="Oleada">Oleada <b id="wave"></b>/20</span>
</div>
<div class="game">
  <canvas id="c" width="640" height="480"></canvas>
  <aside class="side">
    <div class="row" id="shop"></div>
    <div class="row">
      <button class="go" id="start">Iniciar oleada</button>
      <button id="speed">Velocidad x1</button>
      <button id="restart">Reiniciar</button>
      <button id="mapbtn"></button>
    </div>
    <div class="row" id="sel" hidden>
      <button id="up"></button><button id="sell"></button>
    </div>
    <div id="info">Elige una torre y haz clic en un casillero libre para colocarla.</div>
  </aside>
</div>
</main>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
</body>
</html>
